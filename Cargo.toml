[package]
name = "Ssh-manager"
version = "0.2.0"
edition = "2024"

[lib]
name = "ssh_manager"
path = "src/lib.rs"

[dependencies]
eframe = "0.37"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vt100 = "0.18"

[build-dependencies]
embed-resource = "3"

[profile.release]
strip = true
